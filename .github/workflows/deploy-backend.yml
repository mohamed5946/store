name: Deploy Backend to Firebase

# Deploys the Cloud Functions backend + Firestore rules (+ Hosting, so
# one manual run ships the whole backend) to project store-3384c.
# Auth is Workload Identity Federation — no service-account key files
# and no secrets are involved — the SAME pattern as
# .github/workflows/deploy-hosting.yml: the pool (github-pool) and
# provider (github-provider) only trust this repository.
#
# MANUAL ONLY (workflow_dispatch): a functions/rules deploy is never
# automatic — run it from Actions only after the console setup below
# is done and the branch has been reviewed.
#
# !!! NOT READY YET — DO NOT RUN THIS WORKFLOW UNTIL THE CONSOLE
# STEPS BELOW ARE DONE. The service account firebase-deploy@ does
# NOT exist yet and the WIF provider is not yet allowed to impersonate
# it, so any run now fails at the Authenticate step. !!!
#
# CONSOLE SETUP (do once, in console.cloud.google.com, project
# store-3384c):
#
# 1. Create the service account:
#    IAM & Admin -> Service Accounts -> Create service account.
#    Name: firebase-deploy (id becomes
#    firebase-deploy@store-3384c.iam.gserviceaccount.com).
#
# 2. Grant it these THREE roles on the project (IAM & Admin -> IAM ->
#    Grant access, principal = the new service account):
#      - Firebase Admin
#      - Cloud Functions Admin
#      - Service Account User
#    (Service Account User lets it act as the functions runtime
#    identity when deploying; without it the functions deploy fails.)
#
# 3. Let the WIF provider impersonate it:
#    IAM & Admin -> Service Accounts -> firebase-deploy -> Permissions
#    -> Grant access. Principal: the SAME workload-identity principal
#    that already impersonates hosting-deploy@ — copy it verbatim from
#    hosting-deploy@store-3384c.iam.gserviceaccount.com's Permissions
#    tab. Role: Workload Identity User.
#
# 4. Only then run this workflow (Actions -> Deploy Backend to
#    Firebase -> Run workflow). If step 3 is missing, the
#    Authenticate step fails with a permission error — that means the
#    setup above is incomplete, not that the workflow is broken.
#
# Prerequisite (billing): Cloud Functions cannot deploy on the Spark
# plan — the Blaze pay-as-you-go plan must be enabled on store-3384c
# before step 4.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/766975771796/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: firebase-deploy@store-3384c.iam.gserviceaccount.com

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Deploy functions + rules + hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only functions,firestore:rules,hosting --project store-3384c --non-interactive
