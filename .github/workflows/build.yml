name: Build Store Admin APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.7 (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests (UTC)
        run: flutter test
        env:
          TZ: UTC
          TMPDIR: /tmp

      - name: Run tests (Africa/Cairo)
        run: flutter test
        env:
          TZ: Africa/Cairo
          TMPDIR: /tmp

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -la "$APK"
          sha256sum "$APK"
          unzip -l "$APK" | grep 'lib/.*/libapp.so'

      - name: Enforce release cert fingerprint        # Tripwire: the release MUST be signed with the accepted stable key
        # (74:5A..., verified 2026-10-30 with androguard on ALL shipped builds
        # v1.0.0/v1.1.1/v1.1.2: DN CN=Test/OU=Test/O=Test/C=EG, serial
        # 14433908001296680548). The older constants (7B:34, AB:42, 3E:37,
        # 9C:D0, 37:4A) were NOT real certificates: the old guard script
        # hashed bytes from inside the signatures region instead of the
        # certificate, so it false-alarmed on every version while the real
        # key never changed. This step fails the build instead of shipping
        # an APK Android would refuse as an update. The fingerprint is
        # a public certificate identifier, safe to hard-code.
        run: |
          python3 tools/check_release_cert.py build/app/outputs/flutter-apk/app-release.apk 74:5A:63:38:E2:00:D7:43:0A:80:C1:DE:A5:15:2D:C6:DD:A1:D3:D5

      - name: Verify launcher icon has no white edges
        # The icon is a full-bleed dark-navy adaptive icon; any white
        # corner pixel means a preview tile leaked into the assets.
        run: |
          python3 tools/check_icon_corners.py android/app/src/main/res

      - name: Publish to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest" --notes "Latest store admin build"
          gh release upload latest build/app/outputs/flutter-apk/app-release.apk --clobber

      - name: Publish version manifest
        # v1.1.2: in-app updates. CI generates version.json from the
        # REAL build (versionCode/versionName from pubspec, changelog
        # from the commit subject, APK size + SHA-256) and uploads it
        # as a release asset, so
        # https://github.com/mohamed5946/store/releases/download/latest/version.json
        # always describes the published APK. The manifest is never
        # hand-edited. The step also proves the asset is on the release
        # with an AUTHENTICATED check: the repo is PRIVATE, so an
        # anonymous curl 404s even when the asset exists (that false
        # failure is why the v1.1.2 run concluded "failure").
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYEOF'
          import hashlib, json, os, re, subprocess
          apk = 'build/app/outputs/flutter-apk/app-release.apk'
          pub = open('pubspec.yaml').read()
          version = re.search(r'^version:\s*(.+)\s*$', pub, re.M).group(1)
          name, code = version.split('+')
          sha = hashlib.sha256(open(apk, 'rb').read()).hexdigest()
          size = os.path.getsize(apk)
          subject = subprocess.check_output(
              ['git', 'log', '-1', '--format=%s']).decode().strip()
          manifest = {
              'versionCode': int(code),
              'versionName': name,
              'changelog': subject,
              'apkUrl': 'https://github.com/mohamed5946/store/releases/download/latest/app-release.apk',
              'apkSha256': sha,
              'apkSizeBytes': size,
          }
          open('version.json', 'w').write(
              json.dumps(manifest, indent=2, ensure_ascii=False))
          print(json.dumps(manifest, indent=2, ensure_ascii=False))
          PYEOF
          gh release upload latest version.json --clobber
          gh release view latest --json assets \
            --jq '.assets[].name' | grep -qx 'version.json'
