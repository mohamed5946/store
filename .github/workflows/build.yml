name: Build Store Admin APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.7 (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests (UTC)
        run: flutter test
        env:
          TZ: UTC
          TMPDIR: /tmp

      - name: Run tests (Africa/Cairo)
        run: flutter test
        env:
          TZ: Africa/Cairo
          TMPDIR: /tmp

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -la "$APK"
          sha256sum "$APK"
          unzip -l "$APK" | grep 'lib/.*/libapp.so'

      - name: Enforce release cert fingerprint        # Tripwire: the release MUST be signed with the v1.1 key
        # (AB:42...). A silent keystore change broke v1.0.0 -> v1.1
        # updates; this step fails the build instead of shipping an
        # APK Android would refuse as an update. The fingerprint is
        # a public certificate identifier, safe to hard-code.
        run: |
          python3 tools/check_release_cert.py build/app/outputs/flutter-apk/app-release.apk AB:42:13:5E:49:CF:F7:7C:57:D9:A0:D6:4F:BF:8A:31:E9:14:2A:E5

      - name: Verify launcher icon has no white edges
        # The icon is a full-bleed dark-navy adaptive icon; any white
        # corner pixel means a preview tile leaked into the assets.
        run: |
          python3 tools/check_icon_corners.py android/app/src/main/res

      - name: Publish to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest" --notes "Latest store admin build"
          gh release upload latest build/app/outputs/flutter-apk/app-release.apk --clobber
