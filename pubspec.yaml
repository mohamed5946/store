name: storeadmin
description: "Store admin app — manages the Store storefront (catalog, orders, analytics, team)."
publish_to: 'none'
version: 1.1.2+4

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  google_sign_in: ^7.0.0
  cloud_firestore: ^5.4.0
  image_picker: ^1.1.2
  share_plus: ^11.0.0
  path_provider: ^2.1.0
  crypto: ^3.0.6
  http: ^1.2.0
  shared_preferences: ^2.3.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
