<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المتجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="firebase-config.js"></script>
</head>
<body>
<div id="announce" class="announce" hidden></div>
<div class="sticky-top">
  <header>
    <div id="brand">المتجر</div>
    <button id="cartBtn">السلة (<span id="cartCount">0</span>)</button>
  </header>
  <div id="cats"></div>
</div>

<section class="search-area">
  <div class="search-pill">
    <input id="siteSearch" type="search" placeholder="بتدور على إيه؟" aria-label="البحث في المنتجات">
    <button id="searchSubmit" class="search-submit" aria-label="بحث">←</button>
  </div>
</section>

<section id="hero"></section>

<section class="intro">
  <h1 id="tagline">كل اللي تحتاجه، في مكان واحد</h1>
  <p>اطلب دلوقتي وادفع عند الاستلام</p>
  <span class="cod-badge">الدفع عند الاستلام</span>
</section>

<section id="featured"></section>

<section class="section">
  <p class="eyebrow">تسوق حسب القسم</p>
  <h2 class="section-title">الأقسام</h2>
  <div id="catGrid"></div>
</section>

<section id="promos"></section>

<section class="section">
  <p class="eyebrow">منتجاتنا</p>
  <h2 class="section-title">الأكثر رواجًا</h2>
  <main id="grid"></main>
</section>

<section id="deliveryBand"></section>

<footer>
  <div id="footerBrand">المتجر</div>
  <p>الدفع عند الاستلام — ادفع لما طلبك يوصلك</p>
</footer>

<div id="drawer">
  <div class="panel">
    <h2>السلة</h2>
    <div id="cartLines"></div>
    <p><strong>الإجمالي: <span id="cartTotal">0</span> ج.م</strong></p>
    <button class="primary" id="toCheckout">إتمام الطلب</button>
    <button class="secondary" id="closeDrawer">متابعة التسوق</button>
  </div>
</div>

<div id="modal"><div class="sheet" id="modalSheet"></div></div>

<div id="journey">
  <p class="j-title">طلبك اتأكد واتحرك!</p>
  <div class="j-road">
    <div class="j-progress"></div>
    <div class="j-van">
      <svg viewBox="0 0 120 64" width="110" height="58" aria-hidden="true">
        <rect x="4" y="12" width="62" height="36" rx="4" fill="#ffffff" stroke="#ebebeb"/>
        <rect x="66" y="24" width="34" height="24" rx="4" fill="#f2f4f5" stroke="#ebebeb"/>
        <rect x="72" y="28" width="16" height="12" rx="2" fill="#5433eb"/>
        <rect x="14" y="20" width="26" height="16" rx="2" fill="#c0b5f3"/>
        <circle class="wheel" cx="24" cy="50" r="8" fill="#000000" stroke="#787574" stroke-width="2"/>
        <circle class="wheel" cx="84" cy="50" r="8" fill="#000000" stroke="#787574" stroke-width="2"/>
      </svg>
    </div>
  </div>
  <p class="j-sub">العربية ماشية لحد ما توصل لآخر الطريق…</p>
  <button id="jSkip">تخطي</button>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
