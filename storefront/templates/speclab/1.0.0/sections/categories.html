<!-- speclab categories: the filter-chip row. One chip per category, filled by the
     shell; "الكل" is the unfiltered chip. Tap animates (chip pop, CSS only). -->
<section class="sl-page sl-reveal-1" data-section="categories">
  <div class="sl-chips">
    <button class="sl-chip sl-chip-on" data-action="filter-chip">الكل</button>
    <button class="sl-chip" data-action="filter-chip"><span data-slot="category-name"></span></button>
  </div>
</section>
