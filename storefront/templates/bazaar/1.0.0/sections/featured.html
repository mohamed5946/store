<!-- Flash-sale countdown strip. Rendered ONLY by the shell behaviour
     `countdown-strip`, computed from a real promoBanners[].endDate.
     No end date -> the shell hides this whole strip; it never ticks
     toward nothing. The digits below are placeholders the shell fills. -->
<section class="bz-flash">
  <div class="bz-flash-head">
    <h2>عرض ينتهي قريبًا</h2>
    <span class="bz-flash-live">لفترة محدودة</span>
  </div>
  <div class="bz-countdown" data-slot="promo-banner">
    <span class="bz-cd">00</span>
    <span class="bz-cd-sep">:</span>
    <span class="bz-cd">00</span>
    <span class="bz-cd-sep">:</span>
    <span class="bz-cd">00</span>
  </div>
  <p class="bz-flash-note">ينتهي العرض مع نهاية مدة العرض المعلنة</p>
</section>
