<!-- Flash-sale countdown: REMOVED 2026-11-27 (fake-countdown fix).
     This file used to ship a hardcoded 00:00:00 countdown section.
     It rendered with no promo configured — a D2 honesty violation
     (no end date -> no countdown, ever). The bundle must not carry
     its own countdown: data-behaviour is NOT a gateway-allowed
     attribute (bundles enable behaviours in the manifest only), so
     the shell owns the strip — startCountdownStrip creates it at the
     top of the offers mount, ticks it from a real
     promoBanners[].endDate, and hides it when there is none. The
     strip's Bazaar look lives in styles.css
     ([data-behaviour="countdown-strip"]). -->
