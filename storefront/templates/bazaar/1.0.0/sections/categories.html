<!-- Category circles. The shell repeats one circle per category. -->
<section class="bz-cats">
  <h2>تسوّق حسب القسم</h2>
  <div class="bz-cat-row">
    <button class="bz-cat" data-action="select-category">
      <img data-slot="category-image" alt="">
      <span data-slot="category-name"></span>
    </button>
  </div>
</section>
