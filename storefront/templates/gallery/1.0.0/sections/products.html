<section class="gl-products">
  <div class="gl-section-head">
    <p class="gl-label">كل المنتجات</p>
    <h2 class="gl-title">المنتجات</h2>
  </div>
  <div class="gl-grid">
    <div class="gl-card" data-slot="product-card">
      <button class="gl-card-media" data-action="open-product">
        <img class="gl-card-img" data-slot="product-image" alt="" />
      </button>
      <h3 class="gl-card-name" data-slot="product-name"></h3>
      <p class="gl-card-price" data-slot="product-price"></p>
      <button class="gl-add" data-action="add-to-cart">أضف إلى السلة</button>
    </div>
  </div>
</section>
