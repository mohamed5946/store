<section class="scroll-feed">
  <div class="scroll-feed-list">
    <div class="scroll-card" data-slot="product-card">
      <img class="scroll-card-img" data-slot="product-image" alt="">
      <span class="scroll-badge-featured">مميز</span>
      <div class="scroll-card-body">
        <h2 class="scroll-card-name" data-slot="product-name"></h2>
        <div class="scroll-card-price-row">
          <span class="scroll-card-price" data-slot="product-price"></span>
          <span class="scroll-card-old" data-slot="product-old-price"></span>
        </div>
        <button class="scroll-buy-btn" data-action="add-to-cart"><span>اطلب الآن</span></button>
        <button class="scroll-details-btn" data-action="open-product"><span>عرض المنتج</span></button>
      </div>
    </div>
    <div class="scroll-trust-wrap">
      <span class="scroll-trust-label">رسوم التوصيل</span>
      <div class="scroll-trust-card" data-slot="delivery-fee"></div>
    </div>
  </div>
</section>
